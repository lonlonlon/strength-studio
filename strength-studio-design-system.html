  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <div>Locked direction · June 2026<\u002Fdiv>\n      <div style=\"margin-top: 4px; color: #B8B1A4;\">JSF Transformative Pte Ltd<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ HERO / TITLE ============ -->\n  <section style=\"margin-bottom: 96px;\">\n    <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #E05A2D; margin-bottom: 24px; font-weight: 600;\">Locked direction · Clinical Confidence · Canvas palette<\u002Fdiv>\n    <h1 style=\"font-family: 'Instrument Serif', serif; font-size: 104px; line-height: 0.96; letter-spacing: -0.02em; font-weight: 400; margin: 0 0 32px; max-width: 1000px; color: #1F2225;\">\n      The system, locked.\n    <\u002Fh1>\n    <p style=\"font-family: 'Manrope'; font-size: 19px; line-height: 1.55; color: #2E3330; max-width: 720px; font-weight: 400; margin: 0;\">\n      A working foundation for the Strength Studio brand — colour, typography, voice, and components — built around your brand guidelines and the homepage mockup. Everything here is ready to apply to the marketing site, the coach dashboard, print, and lifecycle comms.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ WHAT CHANGED ============ -->\n  <section style=\"display: grid; grid-template-columns: 220px 1fr; gap: 64px; margin-bottom: 96px; padding-bottom: 96px; border-bottom: 1px solid #DDD9D2;\">\n    <div>\n      <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #847B71; margin-bottom: 8px; font-weight: 600;\">Section 01<\u002Fdiv>\n      <div style=\"font-family: 'Manrope'; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 500;\">What changed since v0.1<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family: 'Manrope'; font-size: 16px; line-height: 1.7; color: #2E3330; max-width: 680px;\">\n      <p style=\"margin: 0 0 18px;\">You picked <strong style=\"font-weight: 600;\">Direction C's clinical confidence<\u002Fstrong> for type and components, on <strong style=\"font-weight: 600;\">Direction A's warm palette<\u002Fstrong>. Here's how I reconciled that with your existing brand guidelines.<\u002Fp>\n\n      <div style=\"border-top: 1px solid #DDD9D2;\">\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 20px; padding: 20px 0; border-bottom: 1px solid #DDD9D2; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">01<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px; color: #1F2225;\">Palette is yours, not mine.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 14px; color: #847B71; line-height: 1.6;\">Switched Direction A's placeholder neutrals to your locked tokens: Ironstone, Canvas, Ember, Basalt, Linen, Flint, Charcoal. Your Ember is <span style=\"font-variant-numeric: tabular-nums;\">#E05A2D<\u002Fspan>, slightly warmer than the <span style=\"font-variant-numeric: tabular-nums;\">#D55328<\u002Fspan> I'd pulled from the SVG.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 20px; padding: 20px 0; border-bottom: 1px solid #DDD9D2; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">02<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px; color: #1F2225;\">Basalt is back in.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 14px; color: #847B71; line-height: 1.6;\">You initially said \"orange + black + neutrals only,\" but the locked guidelines codify Basalt <span style=\"font-variant-numeric: tabular-nums;\">#3D6A60<\u002Fspan> as the physio-side accent. That split — Ember for training, Basalt for physio — is too useful to lose. I've kept it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 20px; padding: 20px 0; border-bottom: 1px solid #DDD9D2; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">03<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px; color: #1F2225;\">Manrope replaces Stack Sans for UI.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 14px; color: #847B71; line-height: 1.6;\">As you directed. It still has Stack's plain-spoken legibility but with rounder terminals that pair more honestly with the logotype. I've also kept <strong style=\"color: #1F2225; font-weight: 600;\">Instrument Serif<\u002Fstrong> from your guidelines for hero headlines and campaign moments — the mockup uses it, and dropping it would lose meaningful editorial range.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 20px; padding: 20px 0; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">04<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px; color: #1F2225;\">Components stay clinical, surfaces stay warm.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 14px; color: #847B71; line-height: 1.6;\">Soft 12–14px radii, hairline rules, metadata everywhere, pill CTAs — Direction C's language. Backgrounds shift from C's cool Mist to your warmer Canvas; cards are paper-white floating over it. Same composure, warmer room.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SYSTEM AT A GLANCE ============ -->\n  <section style=\"margin-bottom: 96px;\">\n    <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 64px; margin-bottom: 32px;\">\n      <div>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #847B71; margin-bottom: 8px; font-weight: 600;\">Section 02<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 500;\">The system at a glance<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Manrope'; font-size: 14px; line-height: 1.6; color: #847B71; max-width: 560px;\">A one-screen reference. Detail follows in the sections below.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #fff; border-radius: 16px; padding: 48px 48px 40px; box-shadow: 0 1px 0 #DDD9D2;\">\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 48px;\">\n        <!-- color -->\n        <div>\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Anchors<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; margin-bottom: 16px;\">\n            <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #1F2225;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #F4F0EB; border: 1px solid #DDD9D2;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #E05A2D;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #3D6A60;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 13px; line-height: 1.6; color: #2E3330;\">Ironstone, Canvas, Ember, Basalt — the four-colour core.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- type -->\n        <div>\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Type<\u002Fdiv>\n          <div style=\"font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1; letter-spacing: -0.02em; color: #1F2225; margin-bottom: 2px;\">Headline<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 14px; font-weight: 600; color: #1F2225; margin-bottom: 2px;\">UI &amp; body<\u002Fdiv>\n          <div style=\"font-family: 'Special Gothic Expanded One'; font-size: 13px; letter-spacing: 0.02em; color: #1F2225;\">LOGOTYPE<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.6; color: #847B71; margin-top: 10px;\">Instrument Serif · Manrope · Special Gothic Expanded.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- spacing -->\n        <div>\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Shape<\u002Fdiv>\n          <div style=\"display: flex; align-items: end; gap: 6px; margin-bottom: 16px;\">\n            <div style=\"width: 36px; height: 36px; border-radius: 4px; background: #E6DED4;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 10px; background: #E6DED4;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 16px; background: #E6DED4;\"><\u002Fdiv>\n            <div style=\"width: 36px; height: 36px; border-radius: 999px; background: #E6DED4;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 13px; line-height: 1.6; color: #2E3330;\">4 / 10 / 16 px, plus full pill for CTAs &amp; chips.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- voice -->\n        <div>\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Voice<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 14px; line-height: 1.55; color: #1F2225; font-weight: 500;\">Calm. Specific. Evidence-led. Adults talking to adults.<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71; margin-top: 10px;\">No motivational posters. No \"crush\" or \"smash\". No exclamation marks.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ COLOUR ============ -->\n  <section style=\"margin-bottom: 96px;\">\n    <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 64px; margin-bottom: 32px;\">\n      <div>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #847B71; margin-bottom: 8px; font-weight: 600;\">Section 03<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 500;\">Colour<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Manrope'; font-size: 14px; line-height: 1.6; color: #847B71; max-width: 560px;\">A palette built on contrasts that don't compete. Canvas dominates surface; Ember earns its visibility; Basalt does the healing.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Color strip -->\n    <div style=\"display: flex; height: 56px; border-radius: 10px; overflow: hidden; margin-bottom: 28px;\">\n      <div style=\"flex: 3; background: #1F2225;\"><\u002Fdiv>\n      <div style=\"flex: 6; background: #F4F0EB;\"><\u002Fdiv>\n      <div style=\"flex: 2; background: #E05A2D;\"><\u002Fdiv>\n      <div style=\"flex: 2; background: #3D6A60;\"><\u002Fdiv>\n      <div style=\"flex: 4; background: #E6DED4;\"><\u002Fdiv>\n      <div style=\"flex: 2; background: #847B71;\"><\u002Fdiv>\n      <div style=\"flex: 2; background: #2E3330;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Core -->\n    <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Core — the four anchors<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 40px;\">\n      <div style=\"background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"background: #1F2225; height: 132px; display: flex; align-items: flex-end; padding: 14px 16px;\"><span style=\"font-family: 'Manrope'; font-size: 11px; color: rgba(255,255,255,0.5); font-variant-numeric: tabular-nums;\">#1F2225<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 16px 18px 18px;\">\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #E05A2D; font-weight: 600; margin-bottom: 6px;\">Primary dark<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; color: #1F2225; margin-bottom: 6px;\">Ironstone<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Headlines, navigation, hero backgrounds, footer accents.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"background: #F4F0EB; height: 132px; display: flex; align-items: flex-end; padding: 14px 16px; border-bottom: 1px solid #E6DED4;\"><span style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; font-variant-numeric: tabular-nums;\">#F4F0EB<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 16px 18px 18px;\">\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #E05A2D; font-weight: 600; margin-bottom: 6px;\">Primary light<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; color: #1F2225; margin-bottom: 6px;\">Canvas<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Default page background. Warm without being soft.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"background: #E05A2D; height: 132px; display: flex; align-items: flex-end; padding: 14px 16px;\"><span style=\"font-family: 'Manrope'; font-size: 11px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums;\">#E05A2D<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 16px 18px 18px;\">\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #E05A2D; font-weight: 600; margin-bottom: 6px;\">Action accent<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; color: #1F2225; margin-bottom: 6px;\">Ember<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">CTAs, training labels, active states. The \"do\" colour.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"background: #3D6A60; height: 132px; display: flex; align-items: flex-end; padding: 14px 16px;\"><span style=\"font-family: 'Manrope'; font-size: 11px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums;\">#3D6A60<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 16px 18px 18px;\">\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #3D6A60; font-weight: 600; margin-bottom: 6px;\">Heal accent<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 15px; font-weight: 600; color: #1F2225; margin-bottom: 6px;\">Basalt<\u002Fdiv>\n          <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Physio sections, recovery content. The \"heal\" colour.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Supporting -->\n    <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 16px; font-weight: 600;\">Supporting<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px;\">\n      <div style=\"background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 10px;\">\n          <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #E6DED4; border: 1px solid #DDD9D2;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; font-weight: 600;\">Linen<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 11px; color: #847B71; font-variant-numeric: tabular-nums;\">#E6DED4<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Alternating section background, card surface, input rest.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 10px;\">\n          <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #847B71;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; font-weight: 600;\">Flint<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 11px; color: #847B71; font-variant-numeric: tabular-nums;\">#847B71<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Body copy, captions, metadata. Warmer than pure grey.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 10px;\">\n          <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #2E3330;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; font-weight: 600;\">Charcoal<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 11px; color: #847B71; font-variant-numeric: tabular-nums;\">#2E3330<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Subheadings, label emphasis, strong body text.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 10px;\">\n          <div style=\"width: 36px; height: 36px; border-radius: 8px; background: #fff; border: 1px solid #DDD9D2;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; font-weight: 600;\">Paper<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 11px; color: #847B71; font-variant-numeric: tabular-nums;\">#FFFFFF<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 12px; line-height: 1.55; color: #847B71;\">Card surfaces on Canvas. Type containers.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Proportions -->\n    <div style=\"font- '; font-size: 11px; color: #847B71; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;\">Label · 11 UC<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; line-height: 1.5; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #E05A2D;\">Training · Foundation · 8 sessions<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; font-variant-numeric: tabular-nums;\">Manrope · 600 · UC · +16%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 160px 1fr 240px; gap: 32px; align-items: baseline; padding: 22px 0;\">\n        <div style=\"font-family: 'Manrope'; font-size: 11px; color: #847B71; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;\">Pull quote · 24<\u002Fdiv>\n        <div style=\"font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.35; font-weight: 400; font-style: italic; color: #1F2225; max-width: 560px;\">\"After six months, I'm stronger at 52 than I was at 30.\"<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; font-variant-numeric: tabular-nums;\">Instrument Serif · 400 italic<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ BRAND ESSENTIALS — VOICE ============ -->\n  <section style=\"margin-bottom: 96px;\">\n    <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 64px; margin-bottom: 32px;\">\n      <div>\n        <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #847B71; margin-bottom: 8px; font-weight: 600;\">Section 05<\u002Fdiv>\n        <div style=\"font-family: 'Manrope'; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 500;\">Voice<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'Manrope'; font-size: 14px; line-height: 1.6; color: #847B71; max-width: 560px;\">Four principles. Every sentence should pass at least two. Aligned with the launch plan's \"expert but accessible, confident without arrogance.\"<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 32px;\">\n      <div style=\"background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 1px 0 #DDD9D2;\">\n        <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 4px; font-weight: 600;\">Principles<\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 18px; padding: 18px 0; border-bottom: 1px solid #E6DED4; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">01<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px;\">Specific over vague.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; color: #847B71; line-height: 1.6;\">\"Foundation — 8 sessions, 12 weeks, two re-assessments.\" Not \"transform your body.\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 18px; padding: 18px 0; border-bottom: 1px solid #E6DED4; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">02<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px;\">Calm, not motivational.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; color: #847B71; line-height: 1.6;\">No exclamation marks. No \"crush,\" \"smash,\" \"destroy.\" Adults talking to adults.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 18px; padding: 18px 0; border-bottom: 1px solid #E6DED4; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">03<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px;\">Evidence as quiet authority.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; color: #847B71; line-height: 1.6;\">When we cite physiology or research, do it once and move on. Never lecture.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 28px 1fr; gap: 18px; padding: 18px 0; align-items: baseline;\">\n          <div style=\"font-family: 'Manrope'; font-size: 11px; color: #B8B1A4; letter-spacing: 0.08em; font-weight: 600;\">04<\u002Fdiv>\n          <div>\n            <div style=\"font-family: 'Manrope'; font-size: 16px; font-weight: 600; letter-spacing: -0.005em; margin-bottom: 4px;\">Respect the reader's time.<\u002Fdiv>\n            <div style=\"font-family: 'Manrope'; font-size: 13px; color: #847B71; line-height: 1.6;\">Short sentences. Short paragraphs. If a page needs a tour to navigate, it's wrong.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 1px 0 #DDD9D2; margin-bottom: 16px;\">\n          <div style=\"font-family: 'Manrope'; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #847B71; margin-bottom: 14px; font-weight: 600;\">Vocabulary<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\">\n            <div>\n              <div style=\"font-family: 'Manrope'; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #3D6A60; m
